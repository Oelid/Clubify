# Les tests d'intégration utilisent Testcontainers PostgreSQL ; jamais H2.
spring:
  docker:
    compose:
      enabled: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
clubify:
  auth:
    # En test, l'interface tourne en clair sur localhost : un cookie
    # « Secure » ne serait jamais renvoyé par le navigateur.
    cookie-secure: false
  security:
    jwt:
      secret: test-secret-de-signature-pour-les-tests-uniquement-32o
  encryption:
    key: Y2x1YmlmeS1jbGUtZGUtdGVzdC0zMi1vY3RldHMhISE=
  files:
    storage: memory
