# Propriétés communes. Les valeurs propres à un environnement sont dans
# application-<profil>.yaml ; aucun secret n'est versionné (backend/CLAUDE.md).
spring:
  application:
    name: clubify-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway est propriétaire du schéma
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: fr
    locale-resolver: accept-header

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}

clubify:
  security:
    jwt:
      issuer: clubify
      # Secret de signature : fourni par l'environnement, jamais versionné.
      secret: ${CLUBIFY_JWT_SECRET:}
  encryption:
    # Clé de chiffrement des champs et fichiers sensibles (SEC-03).
    key-id: ${CLUBIFY_ENCRYPTION_KEY_ID:k1}
    key: ${CLUBIFY_ENCRYPTION_KEY:}
  files:
    storage: ${CLUBIFY_FILE_STORAGE:disk}
    disk-root: ${CLUBIFY_FILE_ROOT:./var/files}
