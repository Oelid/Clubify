# Base locale de développement. Démarrée automatiquement par Spring Boot
# en profil dev (spring.docker.compose).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clubify
      POSTGRES_USER: clubify
      POSTGRES_PASSWORD: clubify
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 attend un montage unique sur /var/lib/postgresql, et non
      # sur son sous-dossier data : c'est ce qui rend « pg_upgrade --link »
      # possible plus tard, sans franchir de frontière de montage.
      - clubify-pg:/var/lib/postgresql
volumes:
  clubify-pg:
