<div class="shell" *transloco="let t">
  <aside class="shell__nav">
    <div class="shell__marque">
      <span class="shell__logo">C</span>
      <span class="shell__produit">{{ t('app.name') }}</span>
    </div>

    <nav>
      @for (section of sections(); track section.lien) {
        <a
          class="shell__lien"
          [routerLink]="section.lien"
          routerLinkActive="shell__lien--actif"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="section.icone" />
          </svg>
          {{ t(section.cle) }}
        </a>
      }
    </nav>

    <div class="shell__club">
      <span class="shell__club-nom">{{ club()?.name }}</span>
      <span class="shell__club-saison">{{ t('app.season') }}</span>
    </div>
  </aside>

  <div class="shell__corps">
    <header class="shell__entete">
      <div class="shell__recherche">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg>
        <input type="search" [placeholder]="t('app.search')" [attr.aria-label]="t('app.search')" />
      </div>

      <div class="shell__compte">
        <div class="shell__compte-texte">
          <span class="shell__compte-nom">{{ nom() }}</span>
          <span class="shell__compte-role">{{ role() ? t('role.' + role()) : '' }}</span>
        </div>
        <span class="shell__avatar">{{ initiales() }}</span>
        <button class="shell__deconnexion" type="button" (click)="deconnecter()">
          {{ t('app.signOut') }}
        </button>
      </div>
    </header>

    <main class="shell__contenu">
      <router-outlet />
    </main>
  </div>
</div>
