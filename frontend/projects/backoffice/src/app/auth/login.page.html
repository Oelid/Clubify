<div class="auth" *transloco="let t">
  <div class="auth__carte">
    <div class="auth__marque">
      <span class="auth__logo">C</span>
      <span>{{ t('app.name') }}</span>
    </div>

    <h1 class="auth__titre">{{ t('auth.title') }}</h1>
    <p class="auth__sous-titre">{{ t('auth.subtitle') }}</p>

    <form class="auth__form" (ngSubmit)="soumettre()">
      <label class="champ">
        <span class="champ__libelle">{{ t('auth.email') }}</span>
        <input
          class="champ__saisie"
          type="email"
          name="email"
          autocomplete="username"
          required
          [placeholder]="t('auth.emailPlaceholder')"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          autofocus
        />
      </label>

      <label class="champ">
        <span class="champ__libelle">{{ t('auth.password') }}</span>
        <input
          class="champ__saisie"
          type="password"
          name="motDePasse"
          autocomplete="current-password"
          required
          [placeholder]="t('auth.passwordPlaceholder')"
          [ngModel]="motDePasse()"
          (ngModelChange)="motDePasse.set($event)"
        />
      </label>

      @if (erreur()) {
        <p class="champ__erreur" role="alert" data-testid="erreur">
          {{ t('error.' + erreur()) }}
        </p>
      }

      <a class="auth__oubli" routerLink="/connexion">{{ t('auth.forgotten') }}</a>

      <button class="bouton bouton--primaire" type="submit" [disabled]="enCours()">
        {{ enCours() ? t('auth.submitting') : t('auth.submit') }}
      </button>
    </form>
  </div>

  <p class="auth__pied">{{ t('auth.privacy') }}</p>
</div>
