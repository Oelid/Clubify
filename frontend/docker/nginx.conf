server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # L'API passe par la même origine que l'interface : le cookie HttpOnly de
    # renouvellement, borné au chemin /api/v1/auth, suit sans réglage de CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un dépôt de pièce peut être lourd (règle « files.max_size_mb »).
        client_max_body_size 32m;
    }

    # Application à page unique : toute adresse inconnue rend l'index, et c'est
    # le routeur Angular qui décide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par empreinte ne changent jamais ; l'index, si.
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
